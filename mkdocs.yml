site_name: ZJU FPA 2026 Fall
site_url: https://goldfishhorse.github.io/2026_FPA/
repo_name: GoldfishHorse/2026_FPA
repo_url: https://github.com/GoldfishHorse/2026_FPA/
edit_uri: edit/main/docs/
site_description: 浙江大学 2026-2027 秋冬《程序设计与算法基础》课程网站
copyright: >-
  Copyright &copy; 2026 贺俊哲；基于
  <a href="https://github.com/ZhouTimeMachine/2023_FPA" target="_blank" rel="noopener">ZhouTimeMachine/2023_FPA</a>
  修改

nav:
  - 主页: index.md
  - 开发环境安装与第一次编译运行: env/index.md
  - 调试技术: debug/index.md
  - 编程规范: style/index.md
  - FAQ: faq.md

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 夜间模式
    - media: "(prefers-color-scheme: dark)"
      primary: teal
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 日间模式
  features:
    - content.code.copy
    - navigation.footer
    # - navigation.tabs
    # - navigation.sections
  icon:
    repo: fontawesome/brands/git-alt
    
plugins:
  - search
  - heti:
      extra_skipped_class:
        - arithmatex
      disable_serve: false

extra_javascript:
  - https://cdn.tonycrane.cc/utils/katex.min.js
  - js/katex.js

extra_css:
  - https://cdn.tonycrane.cc/utils/katex.min.css
  - https://fonts.googleapis.com/css?family=Roboto:500,500i,600,600i&display=fallback
  - css/custom.css
  # - css/style.css

markdown_extensions:
  - admonition # mkdocs 警告框
  - md_in_html # 脚注
  - meta # 自定义文章元数据
  - pymdownx.caret # 下划线
  - pymdownx.mark # 文本高亮
  - pymdownx.tilde # 删除线
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.critic
  - pymdownx.arithmatex: # 数学公式的 TeX 语法支持
      generic: true
  - pymdownx.emoji: # 表情支持
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      linenums: true
  - pymdownx.tasklist: # 任务清单支持
      custom_checkbox: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.magiclink
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - tables
  # - toc: # 大纲
  #     permalink: true
  #     slugify: !!python/name:pymdownx.slugs.uslugify
